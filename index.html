<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMWEB - 项目管理</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gantt.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/workbench.css">
  <link rel="stylesheet" href="css/sync.css">
  <link rel="stylesheet" href="css/realtime.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

  <!-- TOOLBAR (Row 1) -->
  <div id="toolbar" class="toolbar">
    <strong class="toolbar-title brand">PMWEB</strong>
    <button class="btn project-button" id="btn-project-select" type="button" title="切换或管理项目">选择项目 ▾</button>
    <input id="search-task" class="search-input" type="search" aria-label="搜索当前项目任务" placeholder="搜索任务">
    <button class="btn btn-primary" id="btn-add-root-task" type="button">+ 新建任务</button>
    <div class="btn-group view-buttons" id="view-toggle-group" aria-label="独立显示开关">
      <button class="btn active" id="btn-view-gantt" type="button" aria-pressed="true" title="甘特图开关">甘特图</button>
      <button class="btn" id="btn-view-calendar" type="button" aria-pressed="false" title="日历开关">日历</button>
    </div>
    <button class="btn" id="btn-column-settings" type="button" title="配置列" aria-haspopup="dialog" aria-expanded="false">列设置</button>
    <div class="menu-container more" id="app-menu">
      <button class="btn btn-menu" id="btn-menu" type="button" aria-haspopup="true" aria-expanded="false" title="更多功能">菜单 ▾</button>
      <nav class="menu-dropdown menu" id="menu-dropdown" role="menu" aria-label="更多功能" hidden>
        <div class="menu-group" data-menu-group="project">
          <button class="menu-item" type="button" role="menuitem" data-action="open-projects">项目管理</button>
        </div>
        <hr class="menu-divider">
        <div class="menu-group" data-menu-group="calendar">
          <button class="menu-item" type="button" role="menuitem" data-action="open-work-calendar">工作日历</button>
        </div>
        <hr class="menu-divider">
        <div class="menu-group" data-menu-group="trash">
          <button class="menu-item" type="button" role="menuitem" data-action="open-recycle-bin">回收站</button>
        </div>
        <hr class="menu-divider">
        <div class="menu-group" data-menu-group="backup">
          <button class="menu-item" type="button" role="menuitem" data-action="export-workspace">导出完整备份 (JSON)</button>
          <button class="menu-item" type="button" role="menuitem" data-action="export-project">导出当前项目 (JSON)</button>
          <button class="menu-item" type="button" role="menuitem" data-action="import-backup">导入备份 / 项目</button>
          <button class="menu-item" type="button" role="menuitem" data-action="export-excel">导出 Excel</button>
        </div>
        <hr class="menu-divider">
        <div class="menu-group" data-menu-group="startup">
          <button class="menu-item" type="button" role="menuitem" data-action="open-startup">启动偏好</button>
        </div>
        <hr class="menu-divider">
        <div class="menu-group" data-menu-group="tools">
          <button class="menu-item" type="button" role="menuitem" data-action="print">打印</button>
        </div>
      </nav>
    </div>
    <input type="file" id="import-backup-file" accept=".json" style="display:none" aria-hidden="true">
  </div>

  <!-- CONTEXT BAR (Row 2) -->
  <div id="context-bar" class="context-bar">
    <div class="context-left">
      <span id="context-label" class="context-label">项目 · 0 个任务</span>
      <div id="history-group" class="btn-group history-group-compact">
        <button class="btn btn-sm btn-icon" id="btn-undo" type="button" disabled title="撤销 (Ctrl+Z)">撤销</button>
        <button class="btn btn-sm btn-icon" id="btn-redo" type="button" disabled title="重做 (Ctrl+Shift+Z)">重做</button>
      </div>
    </div>
    <div id="quick-filters" class="quick-filters btn-group" role="group" aria-label="快捷筛选">
      <button class="btn btn-sm active" type="button" data-filter="all">全部</button>
      <button class="btn btn-sm" type="button" data-filter="todo">未开始</button>
      <button class="btn btn-sm" type="button" data-filter="inProgress">进行中</button>
      <button class="btn btn-sm" type="button" data-filter="thirdParty">第三方</button>
      <button class="btn btn-sm" type="button" data-filter="done">已完成</button>
      <button class="btn btn-sm" type="button" data-filter="overdue">已逾期</button>
      <button class="btn btn-sm" type="button" data-filter="today">今日到期</button>
      <button class="btn btn-sm" type="button" data-filter="next7">未来七天</button>
    </div>
    <div class="context-right">
      <label class="nodes-toggle-label"><input type="checkbox" id="btn-toggle-nodes" checked> 今日节点</label>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <div id="main-container">

    <!-- WORKBENCH -->
    <div id="workbench">
      <div id="grid-pane">
        <div id="grid-header" class="pane-header" role="rowgroup" aria-label="任务表格表头"></div>
        <div id="grid-body" class="pane-body" role="rowgroup" aria-label="任务表格"></div>
      </div>

      <div id="workbench-splitter"
           role="separator"
           aria-orientation="vertical"
           aria-valuemin="320"
           aria-valuenow="560"
           aria-label="调整任务表格宽度"
           tabindex="0"></div>

      <div id="date-panels" class="date-panels">
        <div id="timeline-pane">
          <div id="timeline-header" class="pane-header" role="rowgroup" aria-label="时间轴表头"></div>
          <div id="timeline-body" class="pane-body" role="rowgroup" aria-label="时间轴"></div>
        </div>

        <div id="calendar-panel" class="calendar-panel" role="region" aria-label="月历面板" hidden></div>
      </div>
    </div>

    <!-- TODOS SIDEBAR -->
    <div id="todos-sidebar">
      <div id="todos-sidebar-header">
        <h3>今日节点</h3>
      </div>
      <div id="todos-list"></div>
    </div>

  </div>

  <!-- LEGACY TREE (hidden): 仅保留 TreeView 的过滤、菜单与拖拽工具函数 -->
  <div id="tree-container" hidden aria-hidden="true"></div>

  <!-- STATUS BAR -->
  <div id="status-bar">
    <span class="status-item" id="status-text">0 个任务</span>
    <span class="spacer" style="flex:1"></span>
    <span class="status-item" id="status-info">PMWEB v3.0</span>
  </div>

  <!-- MODAL OVERLAY -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script src="js/date.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/store.js"></script>
  <script src="js/workspace.js"></script>
  <script src="js/recycle-bin.js"></script>
  <script src="js/history.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/attachment-meta.js"></script>
  <script src="js/attachment-store.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/holiday-source.js"></script>
  <script src="js/work-calendar.js"></script>
  <script src="js/task-manager.js"></script>
  <script src="js/row-model.js"></script>
  <script src="js/views.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/tree-view.js"></script>
  <script src="js/gantt-view.js"></script>
  <script src="js/drag-manager.js"></script>
  <script src="js/calendar-view.js"></script>
  <script src="js/column-config.js"></script>
  <script src="js/cell-editor.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/export.js"></script>
  <script src="js/baseline.js"></script>
  <script src="js/grid-pane.js"></script>
  <script src="js/links.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/critical-path.js"></script>
  <script src="js/arrows.js"></script>
  <script src="js/timeline-pane.js"></script>
  <script src="js/workbench.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/sync-queue.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/sync-ui.js"></script>
  <script src="js/share.js"></script>
  <script src="js/project-ui.js"></script>
  <script src="js/recycle-bin-ui.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
  <script src="xlsx.full.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      App.init();
    });
  </script>

  <div class="context-menu" id="context-menu" role="menu"></div>

</body>
</html>
